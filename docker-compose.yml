version: "3.9"

services:
  backend:
    build: ./backend
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - COLPALI_MODEL_NAME=${COLPALI_MODEL_NAME:-vidore/colpali-v1.2}
      - COLPALI_DEVICE=${COLPALI_DEVICE:-cpu}
      - TOP_K=${TOP_K:-5}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: rag-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped